services:
  db:
    image: postgres:18-alpine
    container_name: devboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - devboard_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network

  devboard-auth:
    build:
      context: .
    container_name: devboard-auth
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:${POSTGRES_PASSWORD}@db/auth_db
      DATABASE_URL_SYNC: postgresql+psycopg2://auth_user:${POSTGRES_PASSWORD}@db/auth_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-network

volumes:
  devboard_pgdata:

networks:
  devboard-network:
    name: devboard-network
    driver: bridge
